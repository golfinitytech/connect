# Optional: local PostgreSQL for offline development.
# Production / shared dev uses Supabase (see apps/api/.env.example).
services:
  postgres:
    image: postgres:16
    container_name: golfinity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: golfinity_connect
      POSTGRES_USER: golfinity
      POSTGRES_PASSWORD: golfinity
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U golfinity -d golfinity_connect']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
