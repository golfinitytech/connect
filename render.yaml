# Render Blueprint — free test deployment.
# Render dashboard -> New -> Blueprint -> pick this repo/branch. Fill the `sync: false`
# secrets when prompted (copy them from apps/api/.env). Database stays on Supabase.
#
# Free plan notes: the API sleeps after ~15 min without traffic; the first request
# afterwards takes ~50s while it wakes up.

services:
  - type: web
    name: golfinity-api
    runtime: node
    plan: free
    region: singapore # same region as the Supabase database
    branch: review/tournament-mode
    buildCommand: npm ci && npm -w apps/api run prisma:generate && npm -w apps/api run build
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL # Supabase session pooler (port 5432), from apps/api/.env
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://zmhjnmhowqomkpnnmfsz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY # needed for face photo upload
        sync: false
      - key: SUPABASE_FACE_BUCKET
        value: face-photos

  - type: web
    name: golfinity-dashboard
    runtime: static
    branch: review/tournament-mode
    buildCommand: npm ci && npm -w apps/admin-dashboard run build
    staticPublishPath: apps/admin-dashboard/dist
    routes:
      # Client-side routing (React Router): serve index.html for every path.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_HOST
        fromService:
          type: web
          name: golfinity-api
          property: host
